<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1440">
<title>Bid Card sketch</title>
<style>
  html,body{margin:0}
  body{width:1440px;height:900px;overflow:hidden;background:#0B0B0B;font-family:Georgia,"Times New Roman",serif;position:relative;color:#0B0B0B}
  nav{position:absolute;top:36px;left:60px;right:60px;display:flex;justify-content:space-between;color:#fff;font:700 22px/1 Arial,sans-serif;letter-spacing:.12em}
  .env{position:absolute;left:300px;top:330px;width:840px;height:500px;background:#FFFFFF}
  .liner{position:absolute;left:300px;top:330px;width:0;height:0;border-left:420px solid transparent;border-right:420px solid transparent;border-top:300px solid #9E1B32}
  .card{position:absolute;left:380px;top:120px;width:680px;height:420px;background:#FFFFFF;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:rotate(-3deg);padding:48px 56px;box-sizing:border-box}
  .card h1{margin:0;font:900 170px/0.9 "Arial Black",Impact,sans-serif;letter-spacing:-.03em}
  .card p{margin:22px 0 0;font-size:56px;font-style:italic}
  .code{position:absolute;left:56px;bottom:44px;display:flex;gap:12px}
  .code i{width:56px;height:64px;border:4px solid #0B0B0B;display:block}
  .front{position:absolute;left:300px;top:560px;width:840px;height:270px;background:#F2F2F2;clip-path:polygon(0 0,50% 45%,100% 0,100% 100%,0 100%)}
  .open{position:absolute;right:120px;bottom:80px;background:#fff;color:#0B0B0B;font:900 28px/1 Arial,sans-serif;padding:22px 36px;letter-spacing:.06em}
  .side{position:absolute;left:60px;bottom:80px;color:#fff;font:700 30px/1.3 Arial,sans-serif;width:200px}
</style></head><body>
<nav><span>BIDD</span><span>DROPS · CLOSETS · CUP</span></nav>
<div class="env"></div><div class="liner"></div>
<div class="card"><h1>BIDD</h1><p>Be 1 of 1.</p><div class="code"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="front"></div>
<div class="side">THE CLOSET FOR SEC GREEK LIFE</div>
<div class="open">OPEN YOUR BID</div>
</body></html>
