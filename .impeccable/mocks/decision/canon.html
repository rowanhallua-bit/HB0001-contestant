<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1440">
<title>Category standard sketch</title>
<style>
  html,body{margin:0}
  body{width:1440px;height:900px;overflow:hidden;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#111}
  header{display:flex;align-items:center;gap:40px;padding:28px 60px;border-bottom:1px solid #eee}
  .logo{font:900 44px/1 Arial,sans-serif;letter-spacing:-.04em}
  .search{flex:1;height:56px;border-radius:28px;background:#f2f2f2}
  .pill{background:#111;color:#fff;border-radius:28px;padding:18px 30px;font-weight:700;font-size:22px}
  .chips{display:flex;gap:14px;padding:26px 60px}
  .chips span{border:2px solid #111;border-radius:24px;padding:12px 24px;font-size:22px;font-weight:700}
  .chips span.on{background:#111;color:#fff}
  .drop{margin:0 60px;height:110px;border-radius:16px;background:#9E1B32;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 40px;font:900 40px/1 Arial,sans-serif}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;padding:28px 60px}
  .grid div{height:300px;border-radius:12px;background:#e9e9e9}
</style></head><body>
<header><div class="logo">bidd</div><div class="search"></div><div class="pill">Sell</div></header>
<div class="chips"><span class="on">All</span><span>Rush</span><span>Bid Day</span><span>Gameday</span><span>Formal</span></div>
<div class="drop"><span>Bid Day drop is live</span><span>02:14:09</span></div>
<div class="grid"><div></div><div></div><div></div><div></div><div></div></div>
</body></html>
